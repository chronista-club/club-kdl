[package]
name = "club-kdl"
description = "Fast KDL (KDL Document Language) serialization/deserialization with derive macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kdl", "serialization", "derive", "macro"]
categories = ["encoding", "parsing"]
readme = "README.md"
# Keep the large spec corpus, its dependent tests, and exploratory code out of
# packages, so `cargo test` on the published crate does not require the corpus.
exclude = [
    "tests/kdl-spec",
    "tests/spec_compliance.rs",
    "tests/robustness.rs",
    "tests/compact_spec.rs",
    "research",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
resolver = "2"
members = [".", "derive", "codegen"]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mako <mito@chronista.club>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronista-club/club-kdl"
homepage = "https://github.com/chronista-club/club-kdl"

[workspace.dependencies]
kdl = "6"
thiserror = "2"
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dependencies]
thiserror.workspace = true
club-kdl-derive = { path = "./derive", version = "=0.15.0" }
# `kdl-rs` feature: conversions to and from kdl-rs trees. The engine itself
# does not use kdl-rs.
kdl = { workspace = true, optional = true }
# `compose` feature: `(<)glob` include directives.
glob = { version = "0.3", optional = true }
# Stable identities for reusable compact name tables.
sha2 = { version = "0.10.9", optional = true }

[features]
default = []
# Interop with kdl-rs: `from_kdl_document` / `from_kdl_node` /
# `to_kdl_document`, `From` conversions, `KdlNodeExt`, `club_kdl::kdl`.
kdl-rs = ["dep:kdl"]
# Multi-file composition: `club_kdl::compose` resolves `(<)file` /
# `(<)glob` include directives.
compose = ["dep:glob"]
# Rule-based name aliases in ordinary KDL v2 messages and files.
compact = ["dep:sha2"]

[dev-dependencies]
# Tests, examples and benches always see every feature.
club-kdl = { path = ".", features = ["kdl-rs", "compose", "compact"] }
# Scratch directories for the compose doc-tests.
tempfile = "3"
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = "0.8"

[[bench]]
name = "kdl_vs_json"
harness = false

[[bench]]
name = "name_shortcuts"
harness = false

